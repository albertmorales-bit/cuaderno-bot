# Paper trading diario (dinero ficticio). Un solo workflow que ejecuta el bot,
# sella el hash del día, hace el commit firmado vía API y publica la web.
# No depende de que un commit con GITHUB_TOKEN dispare otro workflow (no lo
# haría), ni de que dispare un build de Pages (tampoco). Ver la documentación
# de GitHub sobre GITHUB_TOKEN y GitHub Pages.
#
# - Cron a las 00:17 UTC (minuto "raro" para evitar el pico de las horas en
#   punto) y segundo intento a las 02:47 UTC por si el primero se retrasa o se
#   pierde. El motor es idempotente: el reintento nunca duplica operaciones.
# - Los commits diarios mantienen el repositorio activo: los cron de un
#   repositorio público se desactivan tras 60 días sin actividad.
# - La web se publica aunque la ejecución del bot falle, para que el fallo
#   (vela perdida) también quede a la vista.
name: Paper trading diario

on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      inicializar:
        description: "Día 0: crear el archivo de velas y el evento de inicio (UNA sola vez)"
        type: boolean
        default: false

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Dependencias (versiones fijadas)
        run: pip install -r requirements.txt opentimestamps-client==0.7.2
      - name: Día 0 (inicialización)
        if: ${{ inputs.inicializar }}
        run: python scripts/ejecutar_diario.py --inicializar
      - name: Ejecución diaria
        if: ${{ !inputs.inicializar }}
        run: python scripts/ejecutar_diario.py
      - name: Sello OpenTimestamps del hash del día
        if: ${{ !inputs.inicializar }}
        continue-on-error: true
        run: python scripts/sellar_hash.py
      - name: Commit firmado vía API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/commit_firmado.py

  web:
    needs: diario
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # el commit que acaba de crear el bot, no el que lanzó el workflow
      - name: Construir la web (solo biblioteca estándar)
        run: python3 scripts/construir_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  desplegar:
    needs: web
    if: ${{ !cancelled() && needs.web.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
